<div
  class="min-h-screen  text-slate-100 bck_meow"
>

  <!-- ============================= -->
  <!-- NAVBAR -->
  <!-- ============================= -->

  <header
    class="sticky top-0 z-50 border-b border-white/5 bg-slate-950/80 backdrop-blur-xl"
  >

    <div
      class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8"
    >

      <!-- LOGO -->

      <a
        routerLink="/"
        class="group flex items-center gap-3"
        (click)="closeMenu()"
      >


        <div class="leading-tight">

          <p class="text-base font-semibold tracking-tight text-white">
            Daniel Cruz
          </p>

          <p class="text-md text-slate-500">
            Licenciado en Informatica
          </p>
          <p class="text-xs text-slate-500">
            Desarrollador de Software
          </p>

        </div>

      </a>


      <!-- DESKTOP MENU -->

      <nav
        class="hidden items-center gap-1 md:flex"
      >

        <a
          routerLink="/portafolio/"
          routerLinkActive="bg-white/5 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
        >
          Inicio
        </a>

        <a
          routerLink="/portafolio/proyectos"
          routerLinkActive="bg-white/5 text-white"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
        >
          Proyectos
        </a>

        <a
          routerLink="/portafolio/sobre-mi"
          routerLinkActive="bg-white/5 text-white"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
        >
          Sobre mí
        </a>

      </nav>


      <!-- RIGHT -->

      <div class="flex items-center gap-3">

        <!-- CONTACT BUTTON -->

        <a
          routerLink="/contacto"
          class="hidden rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-slate-200 md:inline-flex"
        >
          Contactarme
        </a>


        <!-- MOBILE BUTTON -->

        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-xl border border-white/10 text-slate-300 transition hover:bg-white/5 md:hidden"
          (click)="toggleMenu()"
          aria-label="Abrir menú"
        >

          @if (!menuOpen) {

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="4" x2="20" y1="6" y2="6" />
              <line x1="4" x2="20" y1="12" y2="12" />
              <line x1="4" x2="20" y1="18" y2="18" />
            </svg>

          } @else {

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>

          }

        </button>

      </div>

    </div>


    <!-- ============================= -->
    <!-- MOBILE MENU -->
    <!-- ============================= -->

    @if (menuOpen) {

      <div
        class="border-t border-white/5 bg-slate-950 px-5 py-4 md:hidden"
      >

        <nav class="flex flex-col gap-1">

          <a
            routerLink="/"
            (click)="closeMenu()"
            routerLinkActive="bg-white/5 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-xl px-4 py-3 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
          >
            Inicio
          </a>

          <a
            routerLink="/proyectos"
            (click)="closeMenu()"
            routerLinkActive="bg-white/5 text-white"
            class="rounded-xl px-4 py-3 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
          >
            Proyectos
          </a>

          <a
            routerLink="/sobre-mi"
            (click)="closeMenu()"
            routerLinkActive="bg-white/5 text-white"
            class="rounded-xl px-4 py-3 text-sm font-medium text-slate-400 transition hover:bg-white/5 hover:text-white"
          >
            Sobre mí
          </a>

          <a
            routerLink="/contacto"
            (click)="closeMenu()"
            class="mt-3 flex justify-center rounded-xl bg-white px-4 py-3 text-sm font-semibold text-slate-950"
          >
            Contactarme
          </a>

        </nav>

      </div>

    }

  </header>


  <!-- ============================= -->
  <!-- MAIN CONTENT -->
  <!-- ============================= -->

  <main class="relative min-h-[calc(100vh-160px)]">

    <!-- BACKGROUND DECORATION -->

    <div
      class="pointer-events-none fixed inset-0 -z-10 overflow-hidden"
    >

      <div
        class="absolute left-1/2 top-0 h-[500px] w-[700px] -translate-x-1/2 rounded-full bg-violet-600/10 blur-[140px]"
      ></div>

      <div
        class="absolute right-0 top-[500px] h-[400px] w-[400px] rounded-full bg-blue-600/5 blur-[120px]"
      ></div>

    </div>


    <!-- PAGES -->
    <div
      class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8 py-6">
      <router-outlet />
    </div>

  </main>


  <!-- ============================= -->
  <!-- FOOTER -->
  <!-- ============================= -->

  <footer
    class="border-t border-white/5"
  >

    <div
      class="mx-auto flex max-w-7xl flex-col gap-6 px-5 py-8 sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8"
    >

      <div>

        <p class="text-sm font-medium text-slate-300">
          Daniel Enrique López Cruz
        </p>

        <p class="mt-1 text-xs text-slate-500">
          Desarrollador de Software Full Stack
        </p>

      </div>


      <!-- SOCIAL -->

      <div
        class="flex items-center gap-5 text-sm text-slate-500"
      >

        <a
          href="https://github.com/StormyGit"
          target="_blank"
          rel="noopener"
          class="transition hover:text-white"
        >
          GitHub
        </a>

        <a
          href="https://www.linkedin.com/in/daniel-lopez-4635603a6/"
          target="_blank"
          rel="noopener"
          class="transition hover:text-white"
        >
          LinkedIn
        </a>

        <a
          href="mailto:dani.cruzlopez2002@gmail.com"
          class="transition hover:text-white"
        >
          Email
        </a>

      </div>


      <p class="text-xs text-slate-600">
        © 2026 Daniel López
      </p>

    </div>

  </footer>

</div>
